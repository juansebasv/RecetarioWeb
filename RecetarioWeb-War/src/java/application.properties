# ===========================================================================
# Configuracion de RecetarioWeb-War. Se empaqueta en WEB-INF/classes y la lee
# com.RecetarioWeb.Controller.support.AppConfig. Si el archivo falta o una
# clave no es valida, se usan los valores por defecto (ver AppConfig) y queda
# un WARNING en el log.
# ===========================================================================

# --- Reglas de membresia ---------------------------------------------------
# Puntos que otorga publicar una receta.
membership.points-per-recipe=10
# Numero de recetas publicadas a partir del cual se activa la membresia.
membership.recipes-threshold=10

# --- Sesion --------------------------------------------------------------- -
# Vigencia de la cookie de sesion, en segundos (1800 = 30 min).
session.cookie.max-age-seconds=1800

# --- Formato de textos largos en las vistas -------------------------------- -
# A partir de cuantas palabras se recorta un texto en la portada.
text.summary.max-words=20
# Cada cuantas palabras se inserta un salto de linea al recortar.
text.summary.words-per-line=5

# --- Subida de imagenes de empresa -------------------------------------- ---
# Subcarpeta (dentro del temporal del contenedor) donde se guardan las imagenes.
upload.empresa.dir-name=recetario-empresas
# Umbral en bytes a partir del cual el upload se vuelca a disco.
upload.empresa.size-threshold-bytes=1024
