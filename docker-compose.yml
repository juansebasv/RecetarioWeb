# ============================================================================
# RecetarioWeb - entorno local 100% Docker
#
#   docker compose up -d --build      construye y levanta BD + Payara
#   docker compose logs -f app        sigue el arranque / despliegue
#   docker compose down               apaga (conserva la BD)
#   docker compose down -v            apaga y BORRA la BD (reseed limpio)
#
#   App:   http://localhost:8080/RecetarioWeb-War/
#   Admin: http://localhost:4848/   (usuario admin, sin password)
# ============================================================================

services:

  db:
    image: postgres:15-alpine
    container_name: recetario-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sebastian94
      POSTGRES_DB: RecetarioWeb
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - recetario-db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RecetarioWeb"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recetario-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${ADMIN_PORT:-4848}:4848"
    healthcheck:
      test: ["CMD-SHELL", "asadmin --user=$${ADMIN_USER} --passwordfile=$${PASSWORD_FILE} list-applications 2>/dev/null | grep -q RecetarioWeb-War"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 90s

volumes:
  recetario-db-data:

networks:
  default:
    name: recetario-net
